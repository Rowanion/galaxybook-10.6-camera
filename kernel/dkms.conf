PACKAGE_NAME="galaxybook12-camera"
PACKAGE_VERSION="1.0"
AUTOINSTALL="yes"

MAKE[0]="bash dkms-make.sh ${kernelver}"

BUILT_MODULE_NAME[0]="imx258"
BUILT_MODULE_LOCATION[0]="out/drivers/media/i2c"
DEST_MODULE_LOCATION[0]="/updates/dkms"

BUILT_MODULE_NAME[1]="imx241"
BUILT_MODULE_LOCATION[1]="out/drivers/media/i2c"
DEST_MODULE_LOCATION[1]="/updates/dkms"

BUILT_MODULE_NAME[2]="dw9806b"
BUILT_MODULE_LOCATION[2]="out/drivers/media/i2c"
DEST_MODULE_LOCATION[2]="/updates/dkms"

# NOTE: built as ipu-bridge.ko (hyphen) to match the in-tree module filename,
# so DKMS archives/shadows the stock kernel/.../ipu-bridge.ko.xz. Building it
# as ipu_bridge.ko would leave the stock bridge in place and depmod would load
# it instead (-> "Connected 0 cameras").
BUILT_MODULE_NAME[3]="ipu-bridge"
BUILT_MODULE_LOCATION[3]="out/drivers/media/pci/intel"
DEST_MODULE_LOCATION[3]="/updates/dkms"

BUILT_MODULE_NAME[4]="intel_skl_int3472_discrete"
BUILT_MODULE_LOCATION[4]="out/drivers/platform/x86/intel/int3472"
DEST_MODULE_LOCATION[4]="/updates/dkms"
